<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Arpeggio islands</title>
<style>
  :root { color-scheme: light dark; --acc: #e8833a; --dim: #8888; }
  body { font: 14px system-ui; margin: 16px auto; max-width: 1400px; padding: 0 12px; }
  fieldset { border: 1px solid var(--dim); border-radius: 6px; margin: 8px 0; line-height: 2.2; }
  label { margin-right: 14px; white-space: nowrap; }
  input[type=number] { width: 4.5em; }
  button { font: inherit; padding: 3px 12px; border-radius: 6px; border: 1px solid var(--dim); background: #8882; color: inherit; cursor: pointer; }
  button:hover { background: #8884; }
  #go, .save { background: var(--acc); border-color: transparent; color: #fff; }
  #go { font-size: 18px; padding: 5px 22px; }
  .result { padding: 8px 12px; border: 1px solid var(--dim); border-radius: 6px; margin: 8px 0; }
  #now { font-size: 44px; font-weight: 600; min-height: 60px; margin: 8px 0; }
  #now small, #heard { font-size: 20px; font-weight: 400; opacity: .7; }
  #status { color: #d33; }
  .wrap { overflow-x: auto; }
  #graph { display: block; margin: 0 auto; }
  .running fieldset, .running #below, .running #results, .running .hint { display: none; } /* focus mode while playing */
  .hint { opacity: .6; font-size: 12px; }
  output { display: inline-block; width: 2.4em; opacity: .7; }
  #beats i { display: inline-block; width: 12px; height: 12px; margin: 0 3px; border-radius: 50%; background: #8884; vertical-align: middle; }
  #beats i.on { background: var(--acc); transform: scale(1.3); }
  #beats.countin i.on { background: currentColor; }
  #heard.ok { color: #3b3; opacity: 1; }
  #heard.bad { color: #e44; opacity: 1; }
  svg .e { stroke: currentColor; stroke-opacity: .6; stroke-width: 1.6; fill: none; }
  svg .b { stroke: #4a90e2; stroke-opacity: .15; }
  svg .island { fill: #8882; }
  svg .on > .island { fill: #e8833a22; stroke: var(--acc); }
  svg circle { fill: Canvas; stroke: currentColor; }
  svg .cur circle { stroke: var(--acc); stroke-width: 5; r: 19px; }
  svg .nd text { fill: #111; font-weight: 600; }
  .nt { color: #111; border-radius: 9px; padding: 0 6px; margin: 0 1px; font-weight: 600; }
  svg .nxt circle { stroke: var(--acc); stroke-width: 3; }
  svg .on > .chord { fill: var(--acc); font-weight: 700; }
  svg text { font-size: 11px; text-anchor: middle; dominant-baseline: central; fill: currentColor; }
  svg .chord { font-size: 16px; }
  svg #ball { fill: var(--acc); stroke: Canvas; stroke-width: 2; }
  svg #trail { stroke: var(--acc); stroke-width: 3; stroke-opacity: .7; }
  table { border-collapse: collapse; }
  td, th { padding: 2px 7px; border: 1px solid var(--dim); text-align: center; }
  td { cursor: pointer; min-width: 2em; }
  td.ok { background: #3a36; }
  #cents { height: 10px; width: 300px; background: var(--dim); position: relative; display: inline-block; }
  #cents i { position: absolute; left: 50%; width: 3px; height: 100%; background: var(--acc); }
</style>
</head>
<body>
<h2>Arpeggio islands</h2>
<fieldset><legend>Tune</legend>
  <label>Chords (1–8) <input id="chords" size="36" value="G7 Cmaj7"></label>
  <label>or <select id="tpl"></select> in <select id="key"></select></label>
  <button id="rndKey">Random key</button><br>
  <label>Lowest note <input id="low" value="E2" size="4"></label>
  <label>Octaves <input id="oct" type="number" min="1" max="4" value="2"></label>
</fieldset>
<fieldset><legend>Practice</legend>
  <label>BPM <input id="bpm" type="number" min="30" max="300" value="100"></label>
  <label>Notes <select id="rate">
    <option value="0.25">whole</option><option value="0.5">half</option><option value="1" selected>quarter</option>
    <option value="2">8th</option><option value="3">triplet</option><option value="4">16th</option></select></label>
  <label>Mode <select id="mode"><option value="guided">Guided path</option><option value="free">Free (any chord tone)</option></select></label><br>
  <label title="How many nearest notes each note links to (more links = more choices)">Links <input id="links" type="range" min="1" max="5" step="1" value="3"><output></output></label>
  <label title="Chance of restating the same note">Repeats <input id="repeat" type="range" min="0" max="0.6" step="0.05" value="0.1"><output></output></label>
  <label title="Chance of continuing in the same direction">Momentum <input id="momentum" type="range" min="0" max="1" step="0.05" value="0.5"><output></output></label>
  <button id="regen">New graph</button><br>
  <label><input id="score" type="checkbox" checked> Listen &amp; score</label>
  <label title="Synth plays each target note (free mode: the chord on each bar). Scoring is off while this is on, since the mic would hear it.">
    <input id="play" type="checkbox"> Play aloud</label>
  <label><input id="rec" type="checkbox"> Record audio</label>
  <label title="Added on top of the browser's reported output latency. Raise if notes played on time score late or wrong (Bluetooth: ~200)">Latency +ms <input id="latency" type="number" value="30"></label>
  <label title="Mic level below this counts as silence">Mic gate <input id="gate" type="number" step="0.005" min="0" value="0.01"></label>
</fieldset>
<button id="go">Start</button> <span id="beats"><i></i><i></i><i></i><i></i></span> <button id="tunerBtn">Tuner</button>
<span class="hint">Space = start / stop</span>
<span id="tuner" hidden><span id="tnote">–</span> <span id="cents"><i></i></span></span>
<span id="heard"></span> <span id="status"></span>
<div id="results"></div>
<div id="now"></div>
<div id="legend"></div>
<div class="wrap"><svg id="graph"></svg></div>
<div id="below">
<h3>Progress <small id="streak"></small></h3>
<p><small>Best notes/min (BPM × notes per beat) in guided sessions of ≥4 loops with ≥85% hits. Click a cell to load it.</small></p>
<div id="grid"></div>
<h3>Recent</h3>
<div id="hist"></div>
</div>

<script type="module">
import { parseChord, parseNote, buildGraph, makeWalker, detectPitch, freqToMidi, noteName, summarize, rng, BOX, TEMPLATES, KEYS, transpose, rms, makeOnsets, noteLabel } from './core.js';

const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage[k]) ?? d; } catch { return d; } };
const PASS = 0.85, MIN_LOOPS = 4, RATES = { 0.25: 'whole', 0.5: 'half', 1: 'quarter', 2: '8th', 3: 'triplet', 4: '16th' };

// --- settings persistence ---
const IDS = ['chords', 'low', 'oct', 'bpm', 'rate', 'mode', 'links', 'repeat', 'momentum', 'score', 'play', 'rec', 'latency', 'gate'];
const saved = load('arpSettings', {});
const prop = el => el.type === 'checkbox' ? 'checked' : 'value';
for (const id of IDS) {
  const el = $(id);
  if (id in saved) el[prop(el)] = saved[id];
  el.addEventListener('change', () => { saved[id] = el[prop(el)]; localStorage.arpSettings = JSON.stringify(saved); });
}
for (const id of ['links', 'repeat', 'momentum']) {
  const el = $(id), show = () => el.nextElementSibling.textContent = el.value;
  el.addEventListener('input', show); show();
}
const setChords = s => { $('chords').value = s; $('chords').dispatchEvent(new Event('change')); };

$('tpl').innerHTML = '<option value="">template…</option>' + Object.keys(TEMPLATES).map(t => `<option>${t}</option>`).join('');
$('key').innerHTML = KEYS.map(k => `<option>${k}</option>`).join('');
const applyTpl = () => $('tpl').value && setChords(transpose(TEMPLATES[$('tpl').value], $('key').value));
$('tpl').onchange = $('key').onchange = applyTpl;
$('rndKey').onclick = () => { $('key').value = KEYS[Math.floor(Math.random() * 12)]; applyTpl(); };

// --- graph ---
let seed = Date.now() % 1e9, G = null, chords = [];
// Octave shown by colour, not number. Written octave, so B#3 is coloured as octave 3 like its old label.
const OCT = ['#ff6b6b', '#ffd43b', '#69db7c', '#74a4ff', '#c18cff', '#ff8cc6', '#4dd4e8']; // octave 2, 3, 4, …
const label = (ci, m) => { const [, name, o] = noteLabel(chords[ci], m).match(/^(.*?)(-?\d+)$/); return { name, o: +o, col: OCT[(((o - 2) % 7) + 7) % 7] }; };
const chip = (ci, m) => { const l = label(ci, m); return `<span class="nt" style="background:${l.col}">${l.name}</span>`; };

function rebuild() {
  if (run) stop();
  try {
    chords = $('chords').value.trim().split(/\s+/).map(parseChord);
    if (chords.length > 8) throw Error('Max 8 chords');
    G = buildGraph(chords, parseNote($('low').value), +$('oct').value, +$('links').value, rng(seed));
    $('status').textContent = '';
    draw();
  } catch (e) { G = null; $('status').textContent = e.message; $('graph').innerHTML = $('legend').innerHTML = ''; }
}
['chords', 'low', 'oct', 'links'].forEach(id => $(id).addEventListener('change', rebuild));
$('regen').onclick = () => { seed++; rebuild(); };
['bpm', 'rate', 'mode', 'repeat', 'momentum', 'score', 'play', 'rec', 'latency'].forEach(id => $(id).addEventListener('change', () => run && stop()));

// Each chord is an island in progression order; its notes sit where buildGraph scattered them.
let P = {}; // 'ci_midi' -> [x, y]
function draw() {
  const PAD = 28, TOP = 80, x0 = i => 40 + PAD + i * (BOX.w + BOX.gap);
  P = {};
  G.islands.forEach((isl, i) => isl.forEach((m, k) => { P[i + '_' + m] = [x0(i) + G.pos[i][k][0], TOP + G.pos[i][k][1]]; }));
  let s = '';
  G.islands.forEach((_, i) => s += `<g id="r${i}"><rect class="island" x="${x0(i) - PAD}" y="${TOP - PAD}" width="${BOX.w + 2 * PAD}" height="${G.h + 2 * PAD}" rx="30"/>` +
    `<text class="chord" x="${x0(i) + BOX.w / 2}" y="${TOP - PAD - 18}">${chords[i].name}</text></g>`);
  G.bridges.forEach((br, i) => {
    if (i < chords.length - 1) for (const [a, bs] of br) for (const b of bs) {
      const [x1, y1] = P[i + '_' + a], [x2, y2] = P[i + 1 + '_' + b];
      s += `<line class="b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    }
  });
  G.adj.forEach((adj, i) => {
    for (const [a, bs] of adj) for (const b of bs) if (b > a) {
      const [x1, y1] = P[i + '_' + a], [x2, y2] = P[i + '_' + b];
      s += `<line class="e" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    }
  });
  const octs = new Map();
  s += '<line id="trail" visibility="hidden"/>';
  for (const k in P) {
    const [ci, m] = k.split('_').map(Number), [x, y] = P[k];
    const l = label(ci, m); octs.set(l.o, l.col);
    s += `<g id="n${k}" class="nd"><circle cx="${x}" cy="${y}" r="15" style="fill:${l.col}"/><text x="${x}" y="${y}">${l.name}</text></g>`;
  }
  s += '<circle id="ball" r="9" visibility="hidden"/>';
  const svg = $('graph');
  svg.setAttribute('width', x0(chords.length - 1) + BOX.w + PAD + 40); svg.setAttribute('height', TOP + G.h + PAD + 20);
  svg.innerHTML = s;
  $('legend').innerHTML = 'Octave ' + [...octs].sort((a, b) => a[0] - b[0]).map(([o, c]) => `<span class="nt" style="background:${c}">${o}</span>`).join('');
}

// --- audio ---
let ctx, mic, analyser, buf, noise, run = null, starting = false, tunerOn = false, onsets = makeOnsets();
const audio = async () => { ctx ??= new AudioContext(); await ctx.resume(); };
async function ensureMic() {
  await audio();
  if (mic) return;
  mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  analyser = ctx.createAnalyser(); analyser.fftSize = 2048; buf = new Float32Array(2048);
  ctx.createMediaStreamSource(mic).connect(analyser);
}
function releaseMic() {
  if (!mic || run || tunerOn) return;
  mic.getTracks().forEach(t => t.stop()); mic = analyser = null;
}
// Plucked-ish synth note: triangle wave with a fast decay.
function tone(m, t, dur, out, vol = 0.25) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = 440 * 2 ** ((m - 69) / 12);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur);
}

// Filtered noise tick: no pitch, so mic bleed can't be heard as a note.
function click(t, accent, out) {
  if (!noise) {
    noise = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.03), ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 4;
  }
  const src = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = noise; hp.type = 'highpass'; hp.frequency.value = accent ? 1200 : 3000; g.gain.value = accent ? 1 : 0.7;
  src.connect(hp).connect(g).connect(out); src.start(t);
}

async function start() {
  if (!G || starting) return;
  starting = true;
  try {
    await audio();
    if (($('score').checked && !$('play').checked) || $('rec').checked) await ensureMic();
  } catch (e) { $('status').textContent = 'Mic: ' + e.message; return; }
  finally { starting = false; }
  const bpm = +$('bpm').value, rate = +$('rate').value, bar = 240 / bpm, n = Math.round(4 * rate);
  const out = ctx.createGain(); out.connect(ctx.destination);
  const t0 = ctx.currentTime + 0.15 + bar; // one bar count-in
  for (let k = 0; k < 4; k++) click(t0 - bar + k * bar / 4, k === 0, out);
  run = {
    bpm, rate, bar, n, d: bar / n, t0, out, nextBar: 0, slots: [], cur: -1, mode: $('mode').value, score: $('score').checked && !$('play').checked, play: $('play').checked,
    walk: makeWalker(G, { repeat: +$('repeat').value, momentum: +$('momentum').value }, Math.random),
    chordsStr: chords.map(c => c.name).join(' '),
    off: (ctx.outputLatency || 0) + (ctx.baseLatency || 0) + $('latency').value / 1000, // click -> ear -> mic
  };
  if ($('rec').checked) {
    const rec = new MediaRecorder(mic), chunks = [], stamp = new Date().toISOString().slice(0, 16).replace(':', '');
    rec.ondataavailable = e => chunks.push(e.data);
    const r = run;
    rec.onstop = () => {
      r.card.url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      r.card.querySelector('.x').insertAdjacentHTML('beforebegin', `<a download="arp-${stamp}.${rec.mimeType.includes('mp4') ? 'm4a' : 'webm'}" href="${r.card.url}">Download recording</a> `);
    };
    rec.start(); r.rec = rec;
  }
  run.timer = setInterval(schedule, 25); schedule();
  $('go').textContent = 'Stop'; document.body.classList.add('running');
}

// Keep the current and next bar generated so the next notes can be shown ahead of time.
function schedule() {
  const r = run;
  while (r.t0 + r.nextBar * r.bar < ctx.currentTime + r.bar + 0.2) {
    const b = r.nextBar++, ci = b % chords.length, t = r.t0 + b * r.bar;
    for (let k = 0; k < 4; k++) click(t + k * r.bar / 4, k === 0, r.out);
    for (let k = 0; k < r.n; k++) {
      const s = { t: t + k * r.d, d: r.d, ci, target: r.mode === 'guided' ? r.walk(ci) : null, hit: null, heard: false };
      r.slots.push(s);
      if (r.play && s.target !== null) tone(s.target, s.t, Math.min(Math.max(s.d * 1.5, 0.25), 1.5), r.out);
    }
    if (r.play && r.mode === 'free') { // free mode: the chord, voiced from the 2nd octave of the range
      const isl = G.islands[ci], mid = isl.filter(m => m >= G.low + 12 && m < G.low + 24);
      (mid.length ? mid : isl.slice(0, 4)).forEach(m => tone(m, t, Math.min(r.bar, 2), r.out, 0.12));
    }
  }
}

// Each run gets its own result card (kept until closed), so a quick restart loses nothing.
function stop() {
  const r = run; run = null;
  clearInterval(r.timer); r.out.disconnect();
  document.querySelectorAll('#graph .cur, #graph .nxt, #graph .on').forEach(e => e.classList.remove('cur', 'nxt', 'on'));
  $('now').textContent = ''; $('heard').textContent = ''; $('go').textContent = 'Start'; document.body.classList.remove('running');
  document.querySelectorAll('#beats i').forEach(b => b.classList.remove('on'));
  const done = r.slots.filter(s => s.t + s.d <= ctx.currentTime - r.off);
  const e = { d: new Date().toISOString(), chords: r.chordsStr, bpm: r.bpm, rate: r.rate, mode: r.mode, ...summarize(done) };
  const pct = k => Math.round(100 * e[k] / e.n) + '%', ok = e.hit / e.n >= PASS;
  const card = r.card = document.createElement('div');
  card.className = 'result';
  card.innerHTML = (!r.score ? '' : e.n < 8 ? 'Too short to score. ' :
    `<b>${pct('hit')} hit</b> · ${pct('wrong')} wrong · ${pct('silent')} silent · reaction ${e.lat ?? '–'} ms — ` +
    (ok ? `passed! Next: ${r.bpm + 5} BPM, or the next subdivision. ` : `below ${PASS * 100}%: stay here or slow down. `) +
    '<button class="save">Save to log</button> ') + '<button class="x" title="Close">✕</button>';
  if (r.score || r.rec) $('results').prepend(card);
  card.querySelector('.x').onclick = () => { card.remove(); if (card.url) URL.revokeObjectURL(card.url); };
  const save = card.querySelector('.save');
  if (save) save.onclick = () => { log.push(e); localStorage.arpLog = JSON.stringify(log); renderProgress(); save.replaceWith('✓ saved '); };
  r.rec?.stop();
  releaseMic();
}

function show(i) {
  const s = run.slots[i], c = chords[s.ci];
  document.querySelectorAll('#graph .cur, #graph .nxt, #graph .on').forEach(e => e.classList.remove('cur', 'nxt', 'on'));
  $('r' + s.ci)?.classList.add('on');
  if (run.mode === 'free') { $('now').innerHTML = `${c.name} <small>${c.tones.map(t => c.names[t]).join(' ')}</small>`; return; }
  $(`n${s.ci}_${s.target}`)?.classList.add('cur');
  const ahead = run.slots.slice(i + 1, i + 9);
  ahead.slice(0, 3).forEach(a => $(`n${a.ci}_${a.target}`)?.classList.add('nxt'));
  $('now').innerHTML = `${chip(s.ci, s.target)} <small>${c.name} &nbsp;→ ` +
    ahead.map((a, k) => ((k ? ahead[k - 1].ci : s.ci) !== a.ci ? `| ${chords[a.ci].name}: ` : '') + chip(a.ci, a.target)).join(' ') + '</small>';
}

function frame() {
  if (!analyser || !(run?.score || tunerOn)) return;
  analyser.getFloatTimeDomainData(buf);
  const now = ctx.currentTime, gate = +$('gate').value;
  const f = detectPitch(buf, ctx.sampleRate, gate), midi = f ? Math.round(freqToMidi(f)) : null;
  const ev = onsets(rms(buf), midi, now, gate);
  if (tunerOn && f) {
    const m = freqToMidi(f), c = Math.round((m - Math.round(m)) * 100);
    $('tnote').textContent = `${noteName(Math.round(m))} ${c > 0 ? '+' : ''}${c}¢ ${f.toFixed(1)} Hz`;
    $('cents').firstChild.style.left = 50 + c + '%';
  }
  if (!run?.score || !ev) return;
  const t = ev.t - run.off, s = run.slots[Math.floor((t - run.t0) / run.d)];
  if (!s) return;
  s.heard = true;
  const ok = run.mode === 'guided' ? ev.midi === s.target : chords[s.ci].tones.includes(ev.midi % 12);
  $('heard').textContent = noteName(ev.midi) + (ok ? ' ✓' : ' ✗'); $('heard').className = ok ? 'ok' : 'bad';
  if (ok && s.hit === null) s.hit = t - s.t;
}
setInterval(frame, 15); // not rAF: rAF pauses when the window is covered, which would stop scoring

// Visuals: the ball leaves the current note and lands on the next one exactly on its beat.
function anim() {
  requestAnimationFrame(anim);
  const ball = $('ball'), trail = $('trail');
  if (!ball) return;
  const vis = run?.mode === 'guided' && run.slots.length ? 'visible' : 'hidden';
  ball.setAttribute('visibility', vis); trail.setAttribute('visibility', vis);
  if (!run) return;
  const now = ctx.currentTime, i = Math.floor((now - run.t0) / run.d), beat = Math.floor((now - run.t0) / (run.bar / 4));
  $('beats').className = beat < 0 ? 'countin' : '';
  document.querySelectorAll('#beats i').forEach((b, n) => b.classList.toggle('on', n === ((beat % 4) + 4) % 4));
  const k = Math.max(i, 0); // during the count-in, show the first note
  if (k !== run.cur && run.slots[k]) { run.cur = k; show(k); }
  if (vis === 'hidden') return;
  const b = run.slots[Math.max(i + 1, 0)], a = i >= 0 ? run.slots[i] : b;
  if (!a || !b) return;
  const [ax, ay] = P[a.ci + '_' + a.target], [bx, by] = P[b.ci + '_' + b.target];
  const p = Math.min(1, Math.max(0, (now - a.t) / a.d)), h = 18 + Math.hypot(bx - ax, by - ay) * 0.15;
  ball.setAttribute('cx', ax + (bx - ax) * p);
  ball.setAttribute('cy', ay + (by - ay) * p - Math.sin(Math.PI * p) * h);
  trail.setAttribute('x1', ax); trail.setAttribute('y1', ay); trail.setAttribute('x2', bx); trail.setAttribute('y2', by);
}
requestAnimationFrame(anim);

$('go').onclick = () => run ? stop() : start();
$('tunerBtn').onclick = async () => {
  try { await ensureMic(); } catch (e) { $('status').textContent = 'Mic: ' + e.message; return; }
  tunerOn = !tunerOn; $('tuner').hidden = !tunerOn;
  releaseMic();
};
// Space = start/stop anywhere except while typing in a text/number field.
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.code !== 'Space' || (t.tagName === 'INPUT' && !['checkbox', 'range'].includes(t.type))) return;
  e.preventDefault(); t.blur?.(); $('go').click();
});

// --- progress ---
const log = load('arpLog', []);
function renderProgress() {
  const pass = log.filter(e => e.mode === 'guided' && e.hit / e.n >= PASS && e.n >= MIN_LOOPS * 4 * e.rate * e.chords.split(' ').length);
  const best = s => Math.max(0, ...pass.filter(e => e.chords === s).map(e => e.bpm * e.rate));
  $('grid').innerHTML = `<table><tr><th></th>${KEYS.map(k => `<th>${k}</th>`).join('')}</tr>` +
    Object.entries(TEMPLATES).map(([t, tp]) => `<tr><th>${t}</th>` + KEYS.map(k => {
      const s = transpose(tp, k), b = best(s);
      return `<td class="${b ? 'ok' : ''}" data-c="${s}" title="${s}">${b || ''}</td>`;
    }).join('') + '</tr>').join('') + '</table>';
  const days = new Set(log.map(e => new Date(e.d).toDateString())), d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  let streak = 0;
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  const mins = Math.round(log.reduce((a, e) => a + e.n / (e.bpm * e.rate), 0));
  $('streak').textContent = `🔥 ${streak}-day streak · ${mins} min total · ${log.length} sessions`;
  $('hist').innerHTML = '<table><tr><th>When</th><th>Chords</th><th>BPM</th><th>Notes</th><th>Mode</th><th>Hit</th><th>Wrong</th><th>Silent</th><th>Reaction</th></tr>' +
    log.slice(-15).reverse().map(e => `<tr><td>${new Date(e.d).toLocaleString()}</td><td>${e.chords}</td><td>${e.bpm}</td><td>${RATES[e.rate]}</td><td>${e.mode}</td>` +
      ['hit', 'wrong', 'silent'].map(k => `<td>${Math.round(100 * e[k] / e.n)}%</td>`).join('') + `<td>${e.lat ?? '–'} ms</td></tr>`).join('') + '</table>';
}
$('grid').onclick = e => e.target.dataset.c && setChords(e.target.dataset.c);

rebuild();
renderProgress();
</script>
</body>
</html>
